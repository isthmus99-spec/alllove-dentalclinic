<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q&A 관리자 | 모두애치과</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  // ▼▼▼ qna.html과 동일한 Firebase 설정값을 붙여넣으세요 ▼▼▼
  const firebaseConfig = {
     apiKey: "AIzaSyAr9wNqMfy15t6wAeuU7FKw76aLVYkRnf8",
    authDomain: "alllove-dentalclinic.firebaseapp.com",
    projectId: "alllove-dentalclinic",
    storageBucket: "alllove-dentalclinic.firebasestorage.app",
    messagingSenderId: "761187956648",
    appId: "1:761187956648:web:26ad24bfe9f5a282308f9d"
  };
  // ▲▲▲ 여기까지 ▲▲▲
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --teal-deep: #0B4F6C;
    --teal-mid: #1A7A9A;
    --teal-light: #D6EEF5;
    --teal-pale: #EEF7FA;
    --ivory: #F8F6F1;
    --charcoal: #1E2A32;
    --gray-warm: #6B7280;
    --white: #ffffff;
    --gold: #C09E5E;
    --serif: 'Noto Serif KR', serif;
    --sans: 'Noto Sans KR', sans-serif;
  }
  body {
    font-family: var(--sans);
    color: var(--charcoal);
    background: var(--ivory);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* LOGIN */
  #loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-box {
    background: var(--white);
    padding: 48px 40px;
    border-radius: 16px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 10px 40px rgba(11,79,108,0.1);
  }
  .login-box h1 {
    font-family: var(--serif);
    color: var(--teal-deep);
    font-size: 24px;
    margin-bottom: 6px;
    text-align: center;
  }
  .login-box p.sub {
    text-align: center;
    color: var(--gray-warm);
    font-size: 13px;
    margin-bottom: 28px;
  }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--gray-warm); margin-bottom: 6px; }
  .field input, .field textarea, .field select {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid rgba(11,79,108,0.2);
    border-radius: 8px;
    font-size: 14px;
    font-family: var(--sans);
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: none;
    border-color: var(--teal-mid);
  }
  .btn {
    width: 100%;
    background: var(--teal-deep);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: var(--teal-mid); }
  .btn-secondary {
    background: var(--white);
    color: var(--teal-deep);
    border: 1px solid var(--teal-deep);
  }
  .btn-secondary:hover { background: var(--teal-pale); }
  .btn-danger { background: #b2483f; }
  .btn-danger:hover { background: #99392f; }
  .error-msg { color: #b2483f; font-size: 13px; margin-top: 10px; text-align: center; display: none; }

  /* ADMIN DASHBOARD */
  #adminScreen { display: none; }

  header.top {
    background: var(--white);
    border-bottom: 1px solid rgba(11,79,108,0.1);
    padding: 0 32px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header.top .logo { font-family: var(--serif); color: var(--teal-deep); font-size: 20px; font-weight: 600; }
  header.top .actions { display: flex; gap: 10px; align-items: center; }
  header.top .actions button { width: auto; padding: 8px 16px; font-size: 13px; }
  header.top .user-email { font-size: 12px; color: var(--gray-warm); margin-right: 6px; }

  .container { max-width: 900px; margin: 0 auto; padding: 32px 24px 100px; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .toolbar h2 { font-family: var(--serif); color: var(--teal-deep); font-size: 22px; }
  .toolbar button { width: auto; padding: 10px 20px; }

  .post-row {
    background: var(--white);
    border: 1px solid rgba(11,79,108,0.08);
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 10px;
  }
  .post-row-main { flex: 1; min-width: 0; }
  .post-row-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .post-row-meta { font-size: 12px; color: var(--gray-warm); display: flex; gap: 10px; align-items: center; }
  .status-pill { font-size: 11px; padding: 2px 8px; border-radius: 8px; }
  .status-pill.pub { background: var(--teal-pale); color: var(--teal-mid); }
  .status-pill.draft { background: #f3ebe0; color: var(--gold); }
  .post-row-btns { display: flex; gap: 8px; flex-shrink: 0; }
  .post-row-btns button { width: auto; padding: 7px 14px; font-size: 12px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--gray-warm); font-size: 14px; }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 300;
    background: rgba(11,20,26,0.55);
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: var(--white);
    border-radius: 16px;
    max-width: 560px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 32px;
  }
  .modal-box h3 { font-family: var(--serif); color: var(--teal-deep); font-size: 20px; margin-bottom: 20px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .checkbox-row input { width: auto; }
  .checkbox-row label { font-size: 13px; color: var(--charcoal); margin: 0; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <h1>모두애치과</h1>
    <p class="sub">Q&amp;A 관리자 로그인</p>
    <div class="field">
      <label>이메일</label>
      <input type="email" id="loginEmail" placeholder="admin@example.com">
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input type="password" id="loginPw" placeholder="••••••••">
    </div>
    <button class="btn" onclick="doLogin()">로그인</button>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<!-- ADMIN DASHBOARD -->
<div id="adminScreen">
  <header class="top">
    <div class="logo">Q&amp;A 관리자</div>
    <div class="actions">
      <span class="user-email" id="userEmail"></span>
      <button class="btn btn-secondary" onclick="doLogout()">로그아웃</button>
    </div>
  </header>

  <div class="container">
    <div class="toolbar">
      <h2>게시글 목록</h2>
      <button class="btn" onclick="openEditor()">+ 새 글쓰기</button>
    </div>
    <div id="postList"></div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <h3 id="modalTitle">새 글쓰기</h3>
    <input type="hidden" id="editId">
    <div class="field">
      <label>카테고리</label>
      <input type="text" id="editCategory" placeholder="예: 임플란트, 교정, 소아치과">
    </div>
    <div class="field">
      <label>질문 (제목)</label>
      <input type="text" id="editTitle" placeholder="예: 임플란트 시술 후 통증은 얼마나 가나요?">
    </div>
    <div class="field">
      <label>답변 내용</label>
      <textarea id="editContent" rows="8" placeholder="답변 내용을 입력하세요"></textarea>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="editPublished" checked>
      <label for="editPublished">즉시 게시 (체크 해제 시 임시저장)</label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeEditor()">취소</button>
      <button class="btn" onclick="savePost()">저장</button>
    </div>
  </div>
</div>

<script>
let currentPosts = [];
let editingId = null;

// ---- Auth ----
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminScreen').style.display = 'block';
    document.getElementById('userEmail').textContent = user.email;
    loadPosts();
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('adminScreen').style.display = 'none';
  }
});

function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pw = document.getElementById('loginPw').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  auth.signInWithEmailAndPassword(email, pw).catch(err => {
    errEl.textContent = '로그인 실패: 이메일 또는 비밀번호를 확인해주세요.';
    errEl.style.display = 'block';
  });
}
function doLogout() { auth.signOut(); }

// ---- Load posts ----
function loadPosts() {
  db.collection('qna_posts').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
    currentPosts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    renderList();
  });
}

function formatDate(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function renderList() {
  const el = document.getElementById('postList');
  if (currentPosts.length === 0) {
    el.innerHTML = '<div class="empty-state">등록된 글이 없습니다. "새 글쓰기"로 첫 글을 작성해보세요.</div>';
    return;
  }
  el.innerHTML = currentPosts.map(p => `
    <div class="post-row">
      <div class="post-row-main">
        <div class="post-row-title">${escapeHtml(p.title)}</div>
        <div class="post-row-meta">
          <span class="status-pill ${p.published ? 'pub' : 'draft'}">${p.published ? '게시중' : '임시저장'}</span>
          <span>${p.category || '일반'}</span>
          <span>${formatDate(p.createdAt)}</span>
        </div>
      </div>
      <div class="post-row-btns">
        <button class="btn btn-secondary" onclick="openEditor('${p.id}')">수정</button>
        <button class="btn btn-danger" onclick="deletePost('${p.id}')">삭제</button>
      </div>
    </div>
  `).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

// ---- Editor modal ----
function openEditor(id) {
  editingId = id || null;
  if (id) {
    const p = currentPosts.find(x => x.id === id);
    document.getElementById('modalTitle').textContent = '글 수정';
    document.getElementById('editCategory').value = p.category || '';
    document.getElementById('editTitle').value = p.title || '';
    document.getElementById('editContent').value = p.content || '';
    document.getElementById('editPublished').checked = !!p.published;
  } else {
    document.getElementById('modalTitle').textContent = '새 글쓰기';
    document.getElementById('editCategory').value = '';
    document.getElementById('editTitle').value = '';
    document.getElementById('editContent').value = '';
    document.getElementById('editPublished').checked = true;
  }
  document.getElementById('editModal').classList.add('active');
}
function closeEditor() {
  document.getElementById('editModal').classList.remove('active');
}

function savePost() {
  const category = document.getElementById('editCategory').value.trim();
  const title = document.getElementById('editTitle').value.trim();
  const content = document.getElementById('editContent').value.trim();
  const published = document.getElementById('editPublished').checked;

  if (!title || !content) {
    alert('질문(제목)과 답변 내용을 입력해주세요.');
    return;
  }

  if (editingId) {
    db.collection('qna_posts').doc(editingId).update({
      category, title, content, published,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(closeEditor);
  } else {
    db.collection('qna_posts').add({
      category, title, content, published,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(closeEditor);
  }
}

function deletePost(id) {
  if (!confirm('이 글을 삭제하시겠습니까? 삭제하면 되돌릴 수 없습니다.')) return;
  db.collection('qna_posts').doc(id).delete();
}
</script>

</body>
</html>
